server {
    server_name almaluz.moondev.online;

    root /var/www/almaluz;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    # Routing SPA / Estático
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Caché inmutable para imágenes y assets estáticos
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Caché inmutable para bundles versionados de Next.js
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/almaluz.moondev.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/almaluz.moondev.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = almaluz.moondev.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name almaluz.moondev.online;
    return 404; # managed by Certbot
}
